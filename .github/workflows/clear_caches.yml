name: Clear caches

on:
  workflow_dispatch:

jobs:
  clear-cache:
    strategy:
      matrix:
        platform: ['windows-latest', 'macos-latest', 'ubuntu-22.04']

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare cargo cache directories
        run: cargo fetch

      - name: New Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-clear
