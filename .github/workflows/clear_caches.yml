name: Clear caches

on:
  workflow_dispatch:

jobs:
  clear-cache:
    strategy:
      matrix:
        platform: ['windows-latest', 'macos-latest', 'ubuntu-22.04']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: New Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-clear
