name: Build Tauri App

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tauri-build:
    strategy:
      matrix:
        platform: [windows-latest, macos-latest]   # ← Linux を削除

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # アイコン自動生成
      - name: Generate Tauri icons
        run: npx tauri icon ./icon.png

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
