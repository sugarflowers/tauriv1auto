name: Build Tauri App (v1)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tauri-build:
    strategy:
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Generate Tauri icons
        run: npx tauri icon ./icon.png
        working-directory: .

      - name: Build Tauri app
        run: npx tauri build
        working-directory: .

      # -----------------------------
      # ② Windows の種類別アップロード
      # -----------------------------
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Zip portable exe
        if: runner.os == 'Windows'
        run: |
          cd src-tauri/target/release
          powershell Compress-Archive -Path *.exe -DestinationPath app_exe.zip

      - name: Upload Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: src-tauri/target/release/app_exe.zip

      # -----------------------------
      # ③ macOS の種類別アップロード
      # -----------------------------
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload macOS APP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/app/*.app
